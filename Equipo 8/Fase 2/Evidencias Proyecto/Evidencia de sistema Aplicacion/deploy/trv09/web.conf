# Interfaz y API bajo el mismo origen: cookies, adjuntos y WebSocket.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 8080;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 26m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1200s;
        proxy_connect_timeout 3s;
        # No repetir escrituras que podrían haberse confirmado antes de un fallo.
        proxy_next_upstream off;
    }
    location /assets/ { expires 1y; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control no-cache; }
}
